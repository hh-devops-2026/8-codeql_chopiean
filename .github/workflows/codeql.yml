name: CodeQL + Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: CodeQL Analysis
    # Use ubuntu-latest for the analysis job
    runs-on: ubuntu-latest

    # Define permissions for the job
    permissions:
      actions: read
      contents: read
      security-events: write

    # Define language to be analyzed
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/languages/${{ matrix.language }}"

  docker:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: analyze

    # Define steps to build and run the Docker container
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t go-web-server .

      - name: Run Docker container
        run: docker run -d --name go-web-server -p 8080:8080 go-web-server

      - name: Wait for server to start
        run: |
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:8080/readfile?file=safe-files/hello.txt" > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          docker logs go-web-server
          exit 1

      - name: Test /readfile endpoint
        run: |
          response=$(curl -sf "http://localhost:8080/readfile?file=hello.txt")
          echo "Response: $response"
          test -n "$response"

      - name: Stop container
        if: always()
        run: docker rm -f go-web-server
